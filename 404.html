<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <div class="preloader__mark">
        <svg viewBox="0 0 64 64" width="72" height="72" fill="none" style="color:#ff5a2e">
          <circle cx="32" cy="32" r="27" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 5" opacity="0.6"/>

      <div class="preloader__pct">000%</div>

  <main class="error-page" id="main">
    <div class="aurora" aria-hidden="true" style="position:absolute;inset:0">
      <div class="aurora__blob aurora__blob--1" style="opacity:.35"></div>
      <div class="aurora__blob aurora__blob--3" style="opacity:.3"></div>
    </div>
    <div style="position:relative;text-align:center;display:grid;gap:var(--sp-6);justify-items:center">

      <h1 class="cn" style="font-family:var(--font-serif);font-weight:900;font-size:clamp(1.8rem,4.4vw,3.2rem)" data-reveal="up">你要找的页面，偏离了预定轨道</h1>

      <div class="hero__cta" data-reveal="up" style="--d:.1s">
        <a class="btn btn--primary btn--lg" data-magnetic href="index.html">返回地面（首页）<span class="arrow">→</span></a>
        <a class="btn btn--ghost btn--lg" data-magnetic href="work.html">看看任务档案</a>

    </div>
  </main>
